name: Firebase functions CI

on:
  push:
    branches: [main]
    paths:
      - "services/firebase-functions/**"
      - ".github/workflows/firebase-functions.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/firebase-functions/**"
      - ".github/workflows/firebase-functions.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/firebase-functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: services/firebase-functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
