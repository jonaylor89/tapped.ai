name: Deploy Web

# Manual until Vercel's Git integration is repaired. Requires a project-scoped Vercel
# token in the Production environment; never give this job a refresh credential.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Production
    env:
      DEPLOY_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERCEL_ORG_ID: team_vzzWl1A8hSmPuc32f04Lub67
      VERCEL_PROJECT_ID: prj_pcfnjQ1LqWSHpCo2M3n7QkMxyUCl

    steps:
      - name: Require latest main and successful Node CI
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$latest" = "$DEPLOY_SHA"
          conclusion="$(gh api "repos/$GH_REPO/actions/workflows/node.yml/runs?head_sha=$DEPLOY_SHA&event=push&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")][0].conclusion // "pending"')"
          test "$conclusion" = success

      - name: Check out exact verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up deployment CLI runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'

      - name: Require healthy bundled API before web rollout
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://api.tapped.ai/health/ready' > /dev/null
          curl --fail --silent --show-error --max-time 30 \
            'https://api.tapped.ai/app/v1/public/map?swLat=0&swLng=0&neLat=0.001&neLng=0.001' \
            | python3 -c 'import json,sys; b=json.load(sys.stdin); assert all(k in b for k in ["venues","performers","genres","venuesTruncated","performersTruncated"])'

      - name: Deploy verified files to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_APP }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          # Upload the checked-out tree, not a moving Git branch. Only the non-secret
          # revision is passed to the application; the token stays in this runner.
          npx --yes vercel@63.1.2 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --env "TAPPED_DEPLOY_SHA=$DEPLOY_SHA"

      - name: Verify exact live commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            response="$(curl --fail --silent --show-error --max-time 10 \
              --header 'Cache-Control: no-cache' \
              "https://app.tapped.ai/api/version?deployment=$DEPLOY_SHA" || true)"
            if printf '%s' "$response" | EXPECTED_SHA="$DEPLOY_SHA" python3 -c '
          import json,os,sys
          try:
            matches = json.load(sys.stdin).get("commit") == os.environ["EXPECTED_SHA"]
          except (ValueError, AttributeError):
            matches = False
          sys.exit(0 if matches else 1)
          '; then
              echo "Production web is serving $DEPLOY_SHA"
              exit 0
            fi
            echo "Waiting for production revision (attempt $attempt)"
            sleep 15
          done
          echo "Production did not serve the requested revision in time" >&2
          exit 1
