name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'
      - 'services/venue-enrichment/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'
      - 'services/venue-enrichment/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [services/api.tapped.ai, services/venue-enrichment]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}
          
      - name: Build
        run: cargo build --verbose
        
      - name: Clippy
        run: cargo clippy -- -D warnings
        
      - name: Run tests
        run: cargo test --verbose
