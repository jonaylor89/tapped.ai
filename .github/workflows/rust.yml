name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [services/api.tapped.ai]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    # Keep the image in sync with the postgres service in docker-compose.prod.yml.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      
      # Keep in sync with rust-toolchain.toml and the Dockerfile builder image.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}
          
      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --verbose --locked

      # Also covered by `cargo test`; separate so a stale spec is obvious in the checks list.
      - name: OpenAPI spec is up to date
        run: cargo test --locked --test api openapi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
