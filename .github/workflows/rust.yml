name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/api.tapped.ai/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [services/api.tapped.ai]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.project }}
          
      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --verbose --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --verbose --locked

      # Also covered by `cargo test`; separate so a stale spec is obvious in the checks list.
      - name: OpenAPI spec is up to date
        run: cargo test --locked --test api openapi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
