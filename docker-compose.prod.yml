services:
  typesense:
    image: typesense/typesense:0.25.2
    restart: unless-stopped
    # Memory budget for the 4 GB VPS: see platform/README.md before changing any limit.
    mem_limit: 1g
    mem_reservation: 512m
    volumes:
      - /opt/typesense/data:/data
    command: "--data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && echo -e 'GET /health HTTP/1.0\r\n\r\n' >&3 && timeout 2 cat <&3 | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    # The API drains in-flight requests on SIGTERM; requests time out after 90s.
    stop_grace_period: 95s
    environment:
      RUST_LOG: info
      PORT: "3000"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_SEARCH_API_KEY: ${TYPESENSE_API_KEY}
      STREAM_KEY: ${STREAM_KEY}
      STREAM_SECRET: ${STREAM_SECRET}
      MAIL_INGRESS_SECRET: ${MAIL_INGRESS_SECRET}
      MAIL_API_SECRET: ${MAIL_API_SECRET}
      MAIL_STORE_PATH: /data/tapped-mail.sqlite3
      BOOKING_EMAIL_DOMAIN: ${BOOKING_EMAIL_DOMAIN:-booking.tapped.ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    volumes:
      - ./credentials.json:/run/secrets/firebase-credentials.json:ro
      - mail-data:/data
    depends_on:
      typesense:
        condition: service_healthy

  mail-worker:
    image: ${API_IMAGE}
    command: ["mail_worker"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      RUST_LOG: info
      MAIL_STORE_PATH: /data/tapped-mail.sqlite3
      MAIL_TRANSPORT: postmark
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN}
    volumes:
      - mail-data:/data
    depends_on:
      - api

  # Resizes Firebase Storage images for img.tapped.ai; Cloudflare caches every variant at the edge.
  # The preset ladder is mirrored in apps/app.tapped.ai/src/lib/image-loader.ts and
  # com.intheloopstudio/Packages/TappedDomain/Sources/TappedDomain/ImageProxy.swift — change all three together.
  imgproxy:
    image: darthsim/imgproxy:v4.0.17
    restart: on-failure
    mem_limit: 768m
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_WORKERS: "2"
      IMGPROXY_TTL: "31536000"
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_QUALITY: "80"
      IMGPROXY_ALLOWED_SOURCES: "https://firebasestorage.googleapis.com/v0/b/in-the-loop-306520.appspot.com/,https://storage.googleapis.com/in-the-loop-306520.appspot.com/"
      IMGPROXY_ONLY_PRESETS: "true"
      IMGPROXY_PRESETS: >-
        w64=resize:fit:64:0/format:webp,
        w128=resize:fit:128:0/format:webp,
        w256=resize:fit:256:0/format:webp,
        w384=resize:fit:384:0/format:webp,
        w640=resize:fit:640:0/format:webp,
        w828=resize:fit:828:0/format:webp,
        w1080=resize:fit:1080:0/format:webp,
        w1600=resize:fit:1600:0/format:webp,
        sq64=resize:fill:64:64/format:webp,
        sq128=resize:fill:128:128/format:webp,
        sq256=resize:fill:256:256/format:webp,
        sq384=resize:fill:384:384/format:webp
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - typesense
      - imgproxy

volumes:
  mail-data:
