services:
  # Replacing Firestore; internal only (no tunnel route). Setup and backups: platform/README.md.
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # Memory budget for the 4 GB VPS: see platform/README.md before changing any limit.
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=256MB", "-c", "max_connections=30"]
    environment:
      POSTGRES_USER: tapped
      POSTGRES_DB: tapped
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - /opt/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapped -d tapped"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    # The API drains in-flight requests on SIGTERM; requests time out after 90s.
    stop_grace_period: 95s
    environment:
      RUST_LOG: info
      # Trace export to PostHog; off when the token is empty. EU projects set POSTHOG_HOST.
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${API_IMAGE}
      PORT: "3000"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      # postgres://tapped:<POSTGRES_PASSWORD>@postgres:5432/tapped; Postgres is skipped when empty.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for the Postgres-only API}
      REDIS_URL: redis://redis:6379/0
      STREAM_KEY: ${STREAM_KEY}
      STREAM_SECRET: ${STREAM_SECRET}
      MAIL_INGRESS_SECRET: ${MAIL_INGRESS_SECRET}
      MAIL_API_SECRET: ${MAIL_API_SECRET}
      # Auth hooks sign callbacks; all provider business logic lives in Rust.
      AUTH_WEBHOOK_SECRET: ${AUTH_WEBHOOK_SECRET:-}
      # Enable after pending legacy reminder reconciliation; keep old scheduler paused.
      BOOKING_REMINDERS_ENABLED: ${BOOKING_REMINDERS_ENABLED:-0}
      MAIL_STORE_PATH: /data/tapped-mail.sqlite3
      BOOKING_EMAIL_DOMAIN: ${BOOKING_EMAIL_DOMAIN:-booking.tapped.ai}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      # Founder events are durable in Postgres; blank keeps delivery queued, not discarded.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Presigned media uploads to the tapped-media R2 bucket; POST /app/v1/uploads answers 503 when unset.
      # Use a token scoped to Object Read & Write on tapped-media only.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    volumes:
      - mail-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-worker:
    image: ${API_IMAGE}
    command: ["mail_worker"]
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    environment:
      RUST_LOG: info
      # Trace export to PostHog; off when the token is empty. EU projects set POSTHOG_HOST.
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${API_IMAGE}
      MAIL_STORE_PATH: /data/tapped-mail.sqlite3
      MAIL_TRANSPORT: postmark
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN}
    volumes:
      - mail-data:/data
    depends_on:
      - api

  # Optional until least-privilege credentials + templates are provisioned and baseline completes.
  # No identity credentials are mounted into the serving API.
  identity-worker:
    profiles: [identity]
    image: ${API_IMAGE}
    command: [identity_worker]
    restart: unless-stopped
    mem_limit: 192m
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      IDENTITY_CREDENTIALS_FILE: /run/secrets/identity.json
      MAIL_STORE_PATH: /data/tapped-mail.sqlite3
      STREAM_KEY: ${STREAM_KEY}
      STREAM_SECRET: ${STREAM_SECRET}
      AUTH_EFFECTS_ENABLED: ${AUTH_EFFECTS_ENABLED:-0}
      # Direct APNs for iOS builds without FirebaseMessaging. Unset = APNs pushes stay queued.
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.intheloopstudio}
    volumes:
      - mail-data:/data
      - /opt/tapped/identity/credentials.json:/run/secrets/identity.json:ro
      - /opt/tapped/apns:/run/secrets/apns:ro
    depends_on:
      - api

  # Resizes media.tapped.ai (R2) images for img.tapped.ai; Cloudflare caches every variant at the edge.
  # The preset ladder is mirrored in apps/app.tapped.ai/src/lib/image-loader.ts and
  # com.intheloopstudio/Packages/TappedDomain/Sources/TappedDomain/ImageProxy.swift — change all three together.
  imgproxy:
    image: darthsim/imgproxy:v4.0.17
    restart: on-failure
    mem_limit: 768m
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_WORKERS: "2"
      IMGPROXY_TTL: "31536000"
      IMGPROXY_MAX_SRC_RESOLUTION: "40"
      IMGPROXY_QUALITY: "80"
      IMGPROXY_ALLOWED_SOURCES: "https://media.tapped.ai/"
      IMGPROXY_ONLY_PRESETS: "true"
      IMGPROXY_PRESETS: >-
        w64=resize:fit:64:0/format:webp,
        w128=resize:fit:128:0/format:webp,
        w256=resize:fit:256:0/format:webp,
        w384=resize:fit:384:0/format:webp,
        w640=resize:fit:640:0/format:webp,
        w828=resize:fit:828:0/format:webp,
        w1080=resize:fit:1080:0/format:webp,
        w1600=resize:fit:1600:0/format:webp,
        sq64=resize:fill:64:64/format:webp,
        sq128=resize:fill:128:128/format:webp,
        sq256=resize:fill:256:256/format:webp,
        sq384=resize:fill:384:384/format:webp
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - imgproxy

volumes:
  mail-data:
