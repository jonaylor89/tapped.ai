[package]
name = "tapped-api-rs"
authors = ["Johannes Naylor <johannes@tapped.ai>"]
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["macros"] }
axum-extra = "=0.10.3"
axum-swagger-ui = "=0.3.0"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.151"
jsonwebtoken = "=9.3.1"
reqwest = { version = "=0.13.5", default-features = false, features = [
    # OpenSSL, as before 0.13 made rustls/aws-lc the default.
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "form",
    "query",
] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["catch-panic", "cors", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.26.1", features = ["serde", "v4"] }
utoipa = { version = "=6.0.0", features = [
    "axum_extras",
    "chrono",
    "uuid",
    "preserve_order",
    "preserve_path_order",
] }
utoipa-axum = "=0.3.0"
utoipa-redoc = { version = "=7.0.0", features = ["axum"] }
rmcp = { version = "=3.5.0", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
] }
axum-macros = "=0.5.1"
dotenvy = "=0.15.7"
futures = "=0.3.34"
tracing-log = "=0.2.0"
tracing-bunyan-formatter = "=0.3.10"
color-eyre = "=0.6.5"
chrono = { version = "=0.4.45", features = ["serde"] }
derive_builder = "=0.20.2"
tower = { version = "=0.5.3", features = ["timeout"] }
config = "=0.15.27"
async-trait = "=0.1.92"
hmac = "=0.13.0"
sha2 = "=0.11.0"
hex = "=0.4.3"
mailparse = "=0.17.0"
minijinja = { version = "=2.24.0", features = ["loader"] }
# 0.39 is the newest whose libsqlite3-sys matches sqlx 0.9 (one `links = "sqlite3"` allowed).
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "json",
    "uuid",
] }
base64 = "=0.23.1"
redis = { version = "=1.7.1", features = ["tokio-comp"] }
tower_governor = "=0.8.0"
governor = "=0.10.4"
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = [
    "trace",
    "http-proto",
] }
opentelemetry-http = { version = "=0.33.0", default-features = false }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }

[dev-dependencies]
once_cell = "=1.21.4"
tempfile = "=3.27.0"
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "testing"] }
