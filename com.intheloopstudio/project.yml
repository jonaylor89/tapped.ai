name: Tapped
options:
  bundleIdPrefix: com.intheloopstudio
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # The native TestFlight series follows Flutter 1.2.116 (128).
    MARKETING_VERSION: "1.2.117"
    CURRENT_PROJECT_VERSION: "133"
packages:
  TappedDomain:
    path: Packages/TappedDomain
  TappedData:
    path: Packages/TappedData
  TappedUI:
    path: Packages/TappedUI
targets:
  Tapped:
    type: application
    platform: iOS
    sources:
      - path: Tapped
    dependencies:
      - package: TappedDomain
      - package: TappedData
      - package: TappedUI
      - target: TappedWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intheloopstudio
        PRODUCT_NAME: Tapped
        INFOPLIST_FILE: Tapped/Resources/Info.plist
        # Distribution builds need the production APNs entitlement.
        CODE_SIGN_ENTITLEMENTS: Tapped/Resources/TappedRelease.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Existing App Store users include iPad, so updates must remain universal.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_TEAM: "9HNXYM86C6"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: $(inherited) -ObjC
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tapped/Resources/TappedDebug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  TappedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TappedWidgets
      - path: Tapped/Features/LiveActivity/Shared
    dependencies:
      - package: TappedDomain
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intheloopstudio.TappedWidgets
        PRODUCT_NAME: TappedWidgets
        INFOPLIST_FILE: TappedWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TappedWidgets/TappedWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Matches the app: embedded extensions must support every device family the app does.
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "9HNXYM86C6"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG TAPPED_WIDGET_EXTENSION
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: TAPPED_WIDGET_EXTENSION
  TappedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TappedTests
    dependencies:
      - target: Tapped
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intheloopstudio.TappedTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tapped.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tapped
        BUNDLE_LOADER: $(TEST_HOST)
  TappedLaunchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TappedLaunchTests
    dependencies:
      - target: Tapped
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.intheloopstudio.TappedLaunchTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tapped
schemes:
  Runner:
    build:
      targets:
        Tapped: all
        TappedTests: [test]
        TappedLaunchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      environmentVariables:
        TAPPED_MOCK: "1"
      targets:
        - TappedTests
        - TappedLaunchTests
        - package: TappedDomain/TappedDomainTests
        - package: TappedUI/TappedUITests
    archive:
      config: Release
  Tapped Mock:
    build:
      targets:
        Tapped: all
    run:
      config: Debug
      storeKitConfiguration: StoreKit/Tapped.storekit
      environmentVariables:
        TAPPED_MOCK: "1"
    archive:
      config: Debug
